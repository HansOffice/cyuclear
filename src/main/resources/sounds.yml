sounds:
  # 音效总开关
  enabled: true
  # 自动清理倒计时提示音
  cleanup-warning:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.2
  # 清理开始音
  cleanup-start:
    enabled: true
    sound: BLOCK_BEACON_ACTIVATE
    volume: 0.8
    pitch: 1.0
  # 清理完成音
  cleanup-complete:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.9
    pitch: 1.0
  # 全服过载触发音
  panic:
    enabled: true
    sound: ENTITY_WITHER_SPAWN
    volume: 0.9
    pitch: 0.8
  # 单区块硬限制触发音
  chunk-overload:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.8
    pitch: 0.7
  # 打开虚空垃圾桶菜单音
  bin-open:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.8
    pitch: 1.1
  # 虚空垃圾桶关闭倒计时提示音
  bin-warning:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL
    volume: 0.8
    pitch: 1.0
  # 虚空垃圾桶过期销毁音
  bin-expire:
    enabled: true
    sound: BLOCK_CHEST_LOCKED
    volume: 0.8
    pitch: 0.8
  # 玩家手动丢入垃圾桶反馈音
  bin-deposit:
    enabled: true
    sound: ENTITY_ITEM_PICKUP
    volume: 0.6
    pitch: 1.4
