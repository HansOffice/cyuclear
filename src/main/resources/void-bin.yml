# CyuClear 虚空垃圾桶与个人投放缓冲区配置
# 玩家在聊天框输入 /cc bin 即可打开垃圾桶拾回刚被清理的掉落物
# 个人缓冲区暂存手滑误丢的物品，确认后再统一入桶

void-bin:
  # 是否开启虚空垃圾桶功能
  enabled: true
  # 是否允许垃圾桶在未执行清理时也保持常开 (设为 false 时仅在清理后开放指定秒数)
  always-open: false
  # 是否合并相同物品堆叠显示 (开启后多组同类物品折叠显示总数，方便翻找)
  stacked-mode: false
  # 垃圾桶开放有效时长 (秒)，倒计时结束后自动关闭并清空未领取的遗留物
  expire-seconds: 60
  # 垃圾桶关闭前的倒计时提示点 (秒)
  warning-times: [30, 10, 3]
  # 倒计时提示渠道配置
  warning-output:
    # 聊天栏提示
    chat: false
    # 快捷栏 ActionBar 提示
    actionbar: true
    # 顶部 BossBar 提示
    bossbar: false
    # BossBar 颜色: PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE
    bossbar-color: RED
    # BossBar 分段样式: SOLID / SEGMENTED_6 / SEGMENTED_10 / SEGMENTED_12 / SEGMENTED_20
    bossbar-style: SOLID
  deposit-feedback:
    # 玩家向垃圾桶或缓冲区投放物品时是否发送聊天栏反馈提示
    enabled: true
  # 个人手动投放暂存缓冲区配置
  deposit-buffer:
    # 是否开启投放缓冲区 (开启后点击丢入先进入暂存确认菜单，点确认才真正入桶，防误操作)
    enabled: true
  # 物品入桶过滤规则
  entry-rules:
    # 周期清理产物自动进入垃圾桶的规则
    cleanup-recovery:
      # 默认动作：允许 (清理物进入垃圾桶供拾回) / 拒绝 (直接彻底销毁不入桶)
      default: "允许"
      allow-list:
        # 默认匹配方式：精确 / 通配 / 正则
        match-mode: "精确"
        list:
          # - "minecraft:diamond"
          # - "ia:命名空间:物品"
          # - "通配:ce:命名空间:*"
      deny-list:
        # 默认匹配方式：精确 / 通配 / 正则
        match-mode: "精确"
        list:
          # 常用低价值垃圾直接销毁，避免撑满垃圾桶界面
          # - "minecraft:rotten_flesh"
          # - "通配:minecraft:*_seeds"
      # 按展示名过滤
      name-rules:
        enabled: false
        # 颜色代码处理：strip (去除颜色代码) / keep (保留颜色代码)
        color-mode: strip
        allow-list:
          match-mode: "精确"
          list:
            # - "活动纪念品"
            # - "通配:*奖励*"
        deny-list:
          match-mode: "精确"
          list:
            # - "临时物品"
            # - "正则:^测试物品\\d+$"
      # 按 Lore 描述过滤
      lore-rules:
        enabled: false
        # 颜色代码处理：strip (去除颜色代码) / keep (保留颜色代码)
        color-mode: strip
        # 匹配行数模式：any (任意一行命中即可) / all (所有行必须全部命中)
        line-mode: any
        allow-list:
          match-mode: "精确"
          list:
            # - "灵魂绑定"
            # - "通配:*不可交易*"
        deny-list:
          match-mode: "精确"
          list:
            # - "一次性物品"
            # - "通配:*测试服专用*"

    # 玩家手动向垃圾桶投放闲置物品的规则
    player-deposit:
      # 是否允许玩家手动丢弃物品入桶
      enabled: true
      # 手动投放所需权限节点
      permission: "cyuclear.bin.deposit"
      # 垃圾桶内允许容纳的最大独立物品种类数 (填 0 为不限制)
      max-unique-items: 2048
      # 是否拦截全局保留名单中的贵重物品 (防止玩家手滑把保护物资丢进公共桶被他人拿走)
      protect-cleanup-kept-items: false
      # 是否拦截带有内部物品的容器丢入 (如装有物品的潜影盒)
      deny-non-empty-containers: false
      # 默认动作：允许 / 拒绝
      default: "允许"
      allow-list:
        # 默认匹配方式：精确 / 通配 / 正则
        match-mode: "精确"
        list:
          # - "minecraft:cobblestone"
          # - "通配:ia:垃圾分类:*"
      deny-list:
        match-mode: "精确"
        list:
          # - "minecraft:nether_star"
          # - "通配:ce:任务物品:*"
      # 按展示名过滤
      name-rules:
        enabled: false
        color-mode: strip
        allow-list:
          match-mode: "精确"
          list:
            # - "可回收物品"
            # - "通配:*回收券*"
        deny-list:
          match-mode: "精确"
          list:
            # - "重要道具"
            # - "正则:^任务物品\\d+$"
      # 按 Lore 描述过滤
      lore-rules:
        enabled: false
        color-mode: strip
        line-mode: any
        allow-list:
          match-mode: "精确"
          list:
            # - "允许回收"
            # - "通配:*普通材料*"
        deny-list:
          match-mode: "精确"
          list:
            # - "不可丢弃"
            # - "通配:*灵魂绑定*"

  # 清理广播末尾点击快捷打开提示
  open-click:
    # 是否在清理完成广播后追加可点击打开垃圾桶的文本
    enabled: true
    # 点击文本后玩家执行的指令
    command: "/cc bin"

  # 取回冷却防手滑与防刷
  claim-cooldown:
    # 是否开启连续取回冷却限制
    enabled: false
    # 每次成功取回一件物品后的等待秒数
    seconds: 10
    # 绕过取回冷却的权限节点
    bypass-permission: "cyuclear.admin"

  # 玩家取回行为审计
  claim-audit:
    # 是否记录玩家从垃圾桶取走物品的日志与审计历史 (可用 /cc history 查看)
    enabled: true
