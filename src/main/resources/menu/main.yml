# CyuClear - 菜单配置
#
# 结构字段
# title                - 菜单标题，支持颜色代码与占位符
# layout               - 字符画界面，每行 9 格，行数即高度，字符与 items 内的按钮对应
# items                - 每个字符对应的按键材质、名称与点击动作
# material             - 原版材质名（如 HOPPER）或外部物品标识（ia: / ox: / ce: / craftengine:）
# fallback-material    - material 不可用时的安全回退材质
# custom-model-data    - 资源包自定义模型数值
# head                 - 玩家名、UUID 或 base64 皮肤纹理
# name / lore          - 按钮悬浮名称与详细说明行
#
# 标准按键约定
# #                    - 边框装饰板
# P / N                - 上一页 / 下一页
# B                    - 返回上一级菜单
# X                    - 关闭当前菜单
# *                    - 列表动态内容填充槽位（不配置 actions）
#
# 按钮执行动作
# actions              - 点击时从上到下依次执行
# [default]            - 执行该界面的默认物理业务
# [close]              - 关闭当前菜单
# [refresh]            - 刷新当前界面数据
# [prev_page]          - 翻到上一页
# [next_page]          - 翻到下一页
# [open] <入口>        - 打开其他菜单 (bin / deposit-buffer / admin / rules / runs / hotspots)
# [player] <指令>      - 让玩家以自身权限执行指令
# [console] <指令>     - 让后台控制台执行指令
# [message] <文本>     - 向玩家聊天栏发送消息
# [actionbar] <文本>   - 向玩家底部操作栏发送快捷提示
# [title] 主标题;副标题 - 在玩家屏幕中央显示标题
# [sound] 音效 音量 音调 - 为玩家播放指定音效

# 清理规则主菜单
title: "&8CYUCLEAR | 清理设置"
layout:
  - "#########"
  - "# I E R #"
  - "#       #"
  - "####X####"
items:
  "#":
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    fallback-material: STAINED_GLASS_PANE
    name: "&r"
  "I":
    material: HOPPER
    name: "&b掉落物规则"
    lore:
      - "&7物品 ID / 展示名 / Lore 名单"
      - "&7左键进入设置"
      - ""
      - "&f点击进入"
  "E":
    material: CREEPER_SPAWN_EGG
    fallback-material: MONSTER_EGG
    name: "&b实体规则"
    lore:
      - "&7使用刷怪蛋添加实体"
      - ""
      - "&f点击进入"
  "R":
    material: ARROW
    name: "&b实时拦截"
    lore:
      - "&7设置出生时直接拦截的实体"
      - ""
      - "&f点击进入"
  "X":
    material: CYAN_STAINED_GLASS_PANE
    fallback-material: STAINED_GLASS_PANE
    name: "&c关闭"
